      openSettingsSheet();
    });
    g5.appendChild(reset);
    var info = h('div', 'note-box', T('set.privacy'));
    g5.appendChild(info);

    var g6 = group(body, T('set.about'));
    var about = h('div', 'note-box');
    about.innerHTML =
      '<b>Tonalis</b> · ' + T('about.version') + ' ' + VERSION + '<br>' +
      T('about.author') + ': ' + AUTHOR +
      ' &lt;<a href="mailto:' + AUTHOR_MAIL + '" style="color:#C9A227">' + AUTHOR_MAIL + '</a>&gt;<br>' +
      T('about.license') + ': ' + LICENSE + '<br><br>' + T('about.licenseNote');
    g6.appendChild(about);
  });
}

/* ------------------------------------------------------------ Werkzeuge */
var metro = { on: false, bpm: 96, beats: 4, idx: 0, next: 0, timer: 0, dots: null };
function metroClick(t, accent) {
  var ctx = ensureCtx();
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square';
  o.frequency.value = accent ? 1600 : 1050;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(accent ? 0.22 : 0.13, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.07);
}
function metroTick() {
  var ctx = ensureCtx();
  while (metro.next < ctx.currentTime + 0.15) {
    var beat = metro.idx % metro.beats;
    metroClick(metro.next, beat === 0);
    (function (b, when) {
      var delay = Math.max(0, (when - ctx.currentTime) * 1000);
      setTimeout(function () {
        if (!metro.dots) return;
        for (var i = 0; i < metro.dots.length; i++) metro.dots[i].className = '';
        if (metro.dots[b]) metro.dots[b].className = 'hit' + (b === 0 ? ' one' : '');
      }, delay);
    })(beat, metro.next);
    metro.next += 60 / metro.bpm;
    metro.idx++;
  }
}
function metroStart() {
  ensureCtx();
  metro.on = true; metro.idx = 0; metro.next = AC.currentTime + 0.12;
  metro.timer = setInterval(metroTick, 25);
}
function metroStop() {
  metro.on = false;
  clearInterval(metro.timer); metro.timer = 0;
  if (metro.dots) for (var i = 0; i < metro.dots.length; i++) metro.dots[i].className = '';
}

function openToolsSheet() {
  sheetOpen(T('sheet.tools'), function (body) {
    var g1 = group(body, T('tools.demo'));
    g1.appendChild(h('div', 'note-box', T('tools.demoNote')));
    var seg = h('div', 'seg');
    seg.style.marginTop = '10px';
    [['strum', T('tools.strum')], ['single', T('tools.seq')], ['off', T('tools.off')]].forEach(function (o) {
      var b = h('button', '', o[1]);
      b.addEventListener('click', function () {
        if (o[0] === 'off') stopDemo(); else startDemo(o[0]);
        var bs = seg.querySelectorAll('button');
        for (var i = 0; i < bs.length; i++) bs[i].classList.remove('on');
        if (o[0] !== 'off') b.classList.add('on');
      });
      if (demoNode && o[0] !== 'off') b.classList.add('on');
      seg.appendChild(b);
    });
    g1.appendChild(seg);

    var g2 = group(body, T('tools.metro'));
    var big = h('div', 'big-num', metro.bpm + ' bpm');
    g2.appendChild(big);
    var dots = h('div', 'metro-beat');
    metro.dots = [];
    for (var i = 0; i < metro.beats; i++) { var d = document.createElement('i'); dots.appendChild(d); metro.dots.push(d); }
    g2.appendChild(dots);
    fRange(g2, T('tools.tempo'), null, 40, 240, 1,
      function () { return metro.bpm; },
      function (v) { metro.bpm = v; big.textContent = v + ' bpm'; },
      function (v) { return v + ' bpm'; });
    fSelect(g2, T('tools.meter'), null,
      [[2, '2/4'], [3, '3/4'], [4, '4/4'], [6, '6/8'], [1, T('tools.meterNone')]],
      function () { return metro.beats; },
      function (v) {
        metro.beats = parseInt(v, 10);
        dots.innerHTML = ''; metro.dots = [];
        for (var j = 0; j < metro.beats; j++) { var e2 = document.createElement('i'); dots.appendChild(e2); metro.dots.push(e2); }
      });
    var mb = h('button', 'action', metro.on ? T('tools.stop') : T('tools.start'));
    mb.addEventListener('click', function () {
      if (metro.on) { metroStop(); mb.textContent = T('tools.start'); }
      else { metroStart(); mb.textContent = T('tools.stop'); }
    });
    g2.appendChild(mb);
    var taps = [];
    var tap = h('button', 'action', T('tools.tap'));
    tap.addEventListener('click', function () {
      var now = performance.now();
      taps = taps.filter(function (t) { return now - t < 2500; });
      taps.push(now);
      if (taps.length >= 2) {
        var sum = 0;
        for (var k = 1; k < taps.length; k++) sum += taps[k] - taps[k - 1];
        var bpm = Math.round(60000 / (sum / (taps.length - 1)));
        metro.bpm = clamp(bpm, 40, 240);
        big.textContent = metro.bpm + ' bpm';
      }
    });
    g2.appendChild(tap);

    var g3 = group(body, T('tools.chords'));
    var lib = h('button', 'action', T('tools.lib'));
    lib.addEventListener('click', function () { openLibrarySheet(0); });
    g3.appendChild(lib);
  });
}

/* -------------------------------------------------- Akkordbibliothek */
function openLibrarySheet(rootPc) {
  sheetOpen(T('sheet.library'), function (body) {
    var seg = h('div', 'seg');
    for (var pc = 0; pc < 12; pc++) {
      (function (p) {
        var b = h('button', p === rootPc ? 'on' : '', pcName(p));
        b.addEventListener('click', function () { openLibrarySheet(p); });
        seg.appendChild(b);
      })(pc);
    }
    body.appendChild(seg);

    var info = h('p', 'hint', T('lib.info') + tuningName(currentTuning()));
    info.style.textAlign = 'left';
    body.appendChild(info);

    var grid = h('div', 'lib-grid');
    body.appendChild(grid);

    var tun = targetMidis();
    var qs = DSP.QUALITIES;
    var idx = 0;
    (function step() {
      var end = Math.min(qs.length, idx + 4);
      for (; idx < end; idx++) {
        var q = qs[idx];
        var sh = DSP.generateShapes(rootPc, q.iv, tun,
          { limit: 1, optional: q.opt, allowInversions: false, maxFret: 12 });
        if (!sh.length) sh = DSP.generateShapes(rootPc, q.iv, tun,
          { limit: 1, optional: q.opt, allowInversions: true, maxFret: 12, minStrings: 3 });
        if (!sh.length) continue;
        var frets = sh[0].frets;
        var fig = diagramFigure(frets, pcName(rootPc) + q.name);
        (function (fr) {
          fig.addEventListener('click', function () {
            var k = 0;
            fr.forEach(function (f, i) {
              if (f < 0) return;
              setTimeout(function () { playReference(midiToFreq(tun[i] + f)); }, k * 55);
              k++;
            });
          });
        })(frets);
        fig.style.cursor = 'pointer';
        grid.appendChild(fig);
      }
      if (idx < qs.length) setTimeout(step, 0);
    })();
  });
}

/* ============================================================== Aufbau == */
function rebuildInstrument() {
  buildHeadstock();
  buildRows();
  resetStrings();
  $('#tuningName').textContent = tuningName(currentTuning());
  $('#instName').textContent = T(INSTRUMENTS[S.instrument].key) + ' · ' +
    targetFreqs().length + ' ' + T('unit.strings') +
    (S.transpose ? ' · ' + (S.transpose > 0 ? '+' : '') + S.transpose + ' ' + T('unit.st') : '') +
    (S.a4 !== 440 ? ' · A=' + S.a4 : '');
  if (demoNode) startDemo('strum');
  render();
  saveSettings();
}
function rewire() {
  if (micStream && srcNode) {
    try { srcNode.disconnect(); } catch (e) {}
    analyser = makeAnalyser();
    srcNode.connect(analyser);
    setStatus(T('st.listening', { sr: AC.sampleRate, n: fftSizeSafe(),
      ms: (fftSizeSafe() / AC.sampleRate * 1000).toFixed(0) }));
  } else if (demoNode) {
    startDemo('strum');
  }
  saveSettings();
}

function setMode(m) {
  ST.mode = m; S.mode = m; saveSettings();
  var tabs = $('#modes').querySelectorAll('button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute('aria-selected', tabs[i].dataset.mode === m ? 'true' : 'false');
  }
  var chord = (m === 'chord');
  $('#chordview').hidden = !chord;
  $('#readout').hidden = chord;
  $('#strings').hidden = chord;
  $('#hint').hidden = chord;
  $('#stage').hidden = chord;
  if (chord && !ST.chord) renderChord();
  if (m !== 'single') ST.selected = -1;
  render();
}

/* Texte des statischen Markups setzen (sprachabhängig) */
function applyStaticTexts() {
  document.title = T('app.title');
  if (document.documentElement) document.documentElement.lang = S.lang;
  var map = {
    btnTools: 'ui.tools', btnTuning: 'ui.tuningSel',
    btnSettings: 'ui.settings', sheetClose: 'ui.close'
  };
  for (var id in map) {
    var n = $('#' + id);
    if (n) n.setAttribute('aria-label', T(map[id]));
  }
  var hs = $('#hs'); if (hs) hs.setAttribute('aria-label', T('ui.headstock'));
  var tabs = $('#modes').querySelectorAll('button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].textContent = T('mode.' + tabs[i].dataset.mode);
  }
  $('#micLabel').textContent = micStream ? T('foot.micRunning') : T('foot.micStart');
  if (!ST.running) {
    $('#status').textContent = T('foot.ready');
    $('#rdSub').textContent = T('rd.idle');
  }
  if (!ST.chord) { $('#chSub').textContent = T('chord.prompt'); }
  var st = $('#sheetTitle');
  if (st && !$('#sheet').classList.contains('open')) st.textContent = T('sheet.settings');
}

function init() {
  applyStaticTexts();
  $('#stage').classList.toggle('lefty', S.lefty);
  $('#spectrum').hidden = !S.showSpectrum;
  buildGauge();
  rebuildInstrument();
  setMode(S.mode || 'auto');

  $('#btnMic').addEventListener('click', function () {
    if (micStream) stopMic(); else startMic();
  });
  $('#btnSettings').addEventListener('click', openSettingsSheet);
  $('#btnTools').addEventListener('click', openToolsSheet);
  $('#btnTuning').addEventListener('click', openTuningSheet);
  $('#sheetClose').addEventListener('click', sheetClose);
  $('#scrim').addEventListener('click', sheetClose);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') sheetClose(); });

  var tabs = $('#modes').querySelectorAll('button');
  for (var i = 0; i < tabs.length; i++) {
    (function (b) {
      b.addEventListener('click', function () { setMode(b.dataset.mode); });
    })(tabs[i]);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLoop();
    else if (ST.running) startLoop();
  });

  if (!window.isSecureContext && location.protocol === 'file:') {
    setStatus(T('st.file'));
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
